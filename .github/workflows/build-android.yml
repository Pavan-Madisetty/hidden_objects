name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add android/ platform files (lib/, test/, pubspec kept)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --project-name hidden_objects --org com.example .
            git checkout -- lib test pubspec.yaml analysis_options.yaml 2>/dev/null || true
            rm -f test/widget_test.dart
          fi

      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: seek-and-sparkle-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
